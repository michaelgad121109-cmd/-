<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مؤتمر 2026 التفاعلي</title>
    <!-- خط Google الحديث -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        /* CSS: تصميم وتنسيق الواجهة */
        :root {
            --main-color: #2b5a83;
            --accent-color: #f39c12;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #2c3e50;
        }

        * {
            box-sizing: border-box;
            font-family: 'Tajawal', sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px 10px;
        }

        .main-card {
            max-width: 600px;
            margin: 0 auto;
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            padding: 25px;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header h1 {
            color: var(--main-color);
            font-size: 24px;
            margin-bottom: 5px;
        }

        /* شريط التنقل العلوي */
        .nav-bar {
            display: flex;
            justify-content: space-around;
            background: #edf2f7;
            padding: 6px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .nav-btn {
            background: none;
            border: none;
            padding: 10px 12px;
            border-radius: 8px;
            font-weight: bold;
            color: #64748b;
            cursor: pointer;
            transition: 0.3s;
            flex: 1;
            font-size: 14px;
        }

        .nav-btn.active {
            background: var(--main-color);
            color: white;
        }

        /* الأقسام الصفحات */
        .page {
            display: none;
        }

        .page.active-page {
            display: block;
        }

        /* الإدخالات والفورم */
        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
        }

        .btn-action {
            width: 100%;
            padding: 12px;
            background: var(--main-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        /* تصميم كروت الكتب والمسابقات */
        .item-card {
            border: 1px solid #e2e8f0;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .item-btn {
            background: var(--accent-color);
            color: white;
            padding: 8px 12px;
            text-decoration: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: bold;
            border: none;
            cursor: pointer;
        }

        /* لوحة التحكم والصدارة */
        .user-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            border-bottom: 1px solid #f1f5f9;
        }

        .score-badge {
            background: #fef3c7;
            color: #d97706;
            padding: 4px 10px;
            border-radius: 20px;
            font-weight: bold;
        }

        .btn-score {
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            margin-right: 4px;
        }
        .btn-plus { background: #10b981; }
        .btn-minus { background: #ef4444; }
    </style>
</head>
<body>

<div class="main-card">
    <div class="header">
        <h1>🎙️ منصة المؤتمر</h1>
        <p style="color: #64748b; font-size: 14px;">مرحباً بكم في فعاليات اليوم</p>
    </div>

    <!-- 1. شريط التنقل -->
    <div class="nav-bar">
        <button class="nav-btn active" onclick="switchPage('register', this)">التسجيل</button>
        <button class="nav-btn" onclick="switchPage('leaderboard', this)">الترتيب</button>
        <button class="nav-btn" onclick="switchPage('content', this)">الكتب والمسابقات</button>
        <button class="nav-btn" onclick="switchPage('host', this)">الهوست</button>
    </div>

    <!-- 2. صفحة التسجيل -->
    <div id="register" class="page active-page">
        <div class="form-group">
            <label>الاسم بالكامل</label>
            <input type="text" id="nameInput" placeholder="اكتب اسمك هنا...">
        </div>
        <div class="form-group">
            <label>نوع الحساب</label>
            <select id="roleInput">
                <option value="user">حاضر / مراجع</option>
                <option value="host">هوست (منظم)</option>
            </select>
        </div>
        <button class="btn-action" onclick="registerUser()">تسجيل الدخول</button>
    </div>

    <!-- 3. صفحة لوحة الصدارة -->
    <div id="leaderboard" class="page">
        <h3 style="margin-bottom: 15px;">🏆 قائمة المتنافسين</h3>
        <div id="leaderboardData">
            <!-- سيتم ملء البيانات هنا تلقائياً -->
        </div>
    </div>

    <!-- 4. صفحة الكتب والمسابقات -->
    <div id="content" class="page">
        <h3 style="margin-bottom: 15px;">📚 الكتب المتاحة</h3>
        <div class="item-card">
            <div>
                <strong>دليل المؤتمر 2026</strong>
                <p style="font-size: 12px; color: #64748b;">ملف PDF يحتوي التفاصيل</p>
            </div>
            <button class="item-btn" onclick="alert('جاري تحميل الكتاب...')">تحميل</button>
        </div>

        <h3 style="margin-top: 20px; margin-bottom: 15px;">🎮 المسابقات والفعاليات</h3>
        <div class="item-card">
            <div>
                <strong>مسابقة الجلسة الصباحية</strong>
                <p style="font-size: 12px; color: #64748b;">إجابة السؤال تمنحك +20 نقطة</p>
            </div>
            <span class="score-badge">نشطة</span>
        </div>
    </div>

    <!-- 5. صفحة الهوست (التحكم) -->
    <div id="host" class="page">
        <h3 style="margin-bottom: 10px;">⚙️ التحكم في النقاط</h3>
        <p style="font-size: 12px; color: #64748b; margin-bottom: 15px;">خاص بالهوست لتعديل رصيد الحضور:</p>
        <div id="hostControlData">
            <!-- سيتم ملء قوائم المستخدمين للتعديل هنا -->
        </div>
    </div>
</div>

<script>
    /* JavaScript: تشغيل الواجهة وتفاعلاتها */
    let usersList = [];

    // التنقل بين الصفحات
    function switchPage(pageId, btnElement) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active-page'));
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        
        document.getElementById(pageId).classList.add('active-page');
        btnElement.classList.add('active');
        
        updateUI();
    }

    // إضافة مستخدم جديد
    function registerUser() {
        const name = document.getElementById('nameInput').value;
        const role = document.getElementById('roleInput').value;

        if(!name) { alert('برجاء كتابة الاسم'); return; }

        usersList.push({ id: Date.now(), name: name, role: role, score: 0 });
        document.getElementById('nameInput').value = '';
        alert('تم التسجيل بنجاح!');
    }

    // تعديل النقاط
    function updateScore(userId, points) {
        let user = usersList.find(u => u.id === userId);
        if(user) {
            user.score += points;
            updateUI();
        }
    }

    // تحديث البيانات المعروضة في الشاشات
    function updateUI() {
        // تحديث لوحة الصدارة
        const lbContainer = document.getElementById('leaderboardData');
        lbContainer.innerHTML = '';
        
        let sorted = [...usersList].sort((a,b) => b.score - a.score);
        if(sorted.length === 0) lbContainer.innerHTML = '<p style="text-align:center; color:#94a3b8;">لا يوجد مشاركين بعد</p>';

        sorted.forEach((user, idx) => {
            lbContainer.innerHTML += `
                <div class="user-row">
                    <span><b>#${idx+1}</b> ${user.name} ${user.role === 'host' ? '(هوست)' : ''}</span>
                    <span class="score-badge">${user.score} نقطة</span>
                </div>
            `;
        });

        // تحديث لوحة الهوست
        const hostContainer = document.getElementById('hostControlData');
        hostContainer.innerHTML = '';
        
        let attendees = usersList.filter(u => u.role === 'user');
        if(attendees.length === 0) hostContainer.innerHTML = '<p style="text-align:center; color:#94a3b8;">لا يوجد مشاركين للتعديل عليهم</p>';

        attendees.forEach(user => {
            hostContainer.innerHTML += `
                <div class="user-row">
                    <span>${user.name}</span>
                    <div>
                        <button class="btn-score btn-plus" onclick="updateScore(${user.id}, 10)">+10</button>
                        <button class="btn-score btn-minus" onclick="updateScore(${user.id}, -10)">-10</button>
                    </div>
                </div>
            `;
        });
    }
</script>

</body>
</html>
